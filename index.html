<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 50px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
        }
        .search-container input {
            padding: 10px 15px;
            width: 240px;
            border-radius: 4px;
            border: none;
            background: #333;
            color: #fff;
            outline: none;
        }
        .section-title {
            padding: 25px 5% 15px;
            font-size: 22px;
            color: #e50914;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 0 5%;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .movie-card h3 {
            padding: 10px;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Modal Player */
        #playerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #playerModal iframe {
            width: 90%;
            height: 80%;
            border: none;
            border-radius: 8px;
            background: #000;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">OMEGA STREAM</div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search movies..." onkeyup="searchMovies()">
        </div>
    </header>

    <h2 class="section-title">Trending Movies & Shows</h2>
    <div class="movies-grid" id="moviesContainer">
        <!-- Movie Cards with direct embedded player links -->
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=533535')">
            <img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" alt="Deadpool & Wolverine">
            <h3>Deadpool & Wolverine</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=634649')">
            <img src="https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg" alt="Spider-Man: No Way Home">
            <h3>Spider-Man: No Way Home</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=157336')">
            <img src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" alt="Interstellar">
            <h3>Interstellar</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=934632')">
            <img src="https://image.tmdb.org/t/p/w500/pFlaoHTZeyNkG83vxsAJiGzfSsa.jpg" alt="Animal">
            <h3>Animal</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=401314')">
            <img src="https://image.tmdb.org/t/p/w500/6uhavAb8k8CrvgMCa4J9vVwUu0R.jpg" alt="Drishyam">
            <h3>Drishyam</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/tv?tmdb=119051')">
            <img src="https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg" alt="Wednesday">
            <h3>Wednesday</h3>
        </div>
        <div class="movie-card" onclick="openPlayer('https://vidsrc.me/embed/movie?tmdb=138843')">
            <img src="https://image.tmdb.org/t/p/w500/wVYREutTvI2tmxr6ujrHT704wGF.jpg" alt="The Conjuring">
            <h3>The Conjuring</h3>
        </div>
    </div>

    <!-- Modal Player -->
    <div id="playerModal">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        <button class="close-btn" onclick="closePlayer()">Close Player</button>
    </div>

    <script>
        function openPlayer(url) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = url;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = '';
            modal.style.display = 'none';
        }

        function searchMovies() {
            let input = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('movie-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
        </html>
